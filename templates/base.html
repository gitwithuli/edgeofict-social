<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.APP_TITLE }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css', v=config.STATIC_ASSET_VERSION) }}">
    <script defer src="{{ url_for('static', filename='app.js', v=config.STATIC_ASSET_VERSION) }}"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    {% block body %}{% endblock %}
</body>
</html>
