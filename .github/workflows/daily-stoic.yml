name: Manual ICT Quote Queue Report

on:
  workflow_dispatch:

jobs:
  ict-quote-queue-report:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Report ICT quote queue
        run: python main.py queue-status --json-output
